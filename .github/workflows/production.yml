name: Production Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Django deployment checks
        env:
          SECRET_KEY: ci-test-only-not-for-production
          DEBUG: "False"
          ALLOWED_HOSTS: localhost
          CSRF_TRUSTED_ORIGINS: http://localhost
        run: |
          python manage.py check --deploy
          python manage.py check
          python -m pytest -q

  container-build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build API image
        run: docker build -t repository-agent-api:ci .
      - name: Build sandbox image
        run: docker build -f sandbox.Dockerfile -t repository-sandbox:ci .
      - name: Validate compose
        run: docker compose -f docker-compose.production.yml config

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: container-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/smart-campus-ai-system
          docker build -t $IMAGE:${{ github.ref_name }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.ref_name }}
          docker push $IMAGE:latest
