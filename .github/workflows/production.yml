name: Production Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Django deployment checks
        env:
          SECRET_KEY: ci-test-only-not-for-production
          DEBUG: "False"
          ALLOWED_HOSTS: localhost
          CSRF_TRUSTED_ORIGINS: http://localhost
        run: |
          python manage.py check --deploy
          python manage.py check
          python -m pytest -q

  container-build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build API image
        run: docker build -t repository-agent-api:ci .
      - name: Build sandbox image
        run: docker build -f sandbox.Dockerfile -t repository-sandbox:ci .
      - name: Validate compose
        run: |
          printf '%s\n' \
            'SECRET_KEY=ci-test-only-not-for-production' \
            'DEBUG=False' \
            'ALLOWED_HOSTS=localhost' \
            'CSRF_TRUSTED_ORIGINS=http://localhost:8000' \
            'SECURE_SSL_REDIRECT=False' \
            'POSTGRES_DB=repository_agent' \
            'POSTGRES_USER=repository_agent' \
            'POSTGRES_PASSWORD=ci-only-password' \
            'DB_HOST=postgres' \
            'DB_PORT=5432' \
            'DB_NAME=repository_agent' \
            'DB_USER=repository_agent' \
            'DB_PASSWORD=ci-only-password' \
            'REDIS_URL=redis://redis:6379/0' \
            'SANDBOX_IMAGE=repository-sandbox:ci' \
            'LOG_LEVEL=INFO' > .env.production
          docker compose --env-file .env.production -f docker-compose.production.yml config

      - name: Production-like smoke deployment
        env:
          SECRET_KEY: ci-test-only-not-for-production
        run: |
          printf '%s\n' \
            'SECRET_KEY=ci-test-only-not-for-production' \
            'DEBUG=False' \
            'ALLOWED_HOSTS=localhost' \
            'CSRF_TRUSTED_ORIGINS=http://localhost:8000' \
            'POSTGRES_DB=repository_agent' \
            'POSTGRES_USER=repository_agent' \
            'POSTGRES_PASSWORD=ci-only-password' \
            'DB_HOST=postgres' \
            'DB_PORT=5432' \
            'DB_NAME=repository_agent' \
            'DB_USER=repository_agent' \
            'DB_PASSWORD=ci-only-password' \
            'REDIS_URL=redis://redis:6379/0' \
            'SANDBOX_IMAGE=repository-sandbox:ci' \
            'LOG_LEVEL=INFO' > .env.production
          docker compose -f docker-compose.production.yml build
          docker compose --env-file .env.production -f docker-compose.production.yml up -d postgres redis
          trap 'docker compose --env-file .env.production -f docker-compose.production.yml down -v' EXIT
          for i in $(seq 1 30); do
            if docker compose --env-file .env.production -f docker-compose.production.yml exec -T postgres pg_isready -U repository_agent -d repository_agent; then break; fi
            docker compose --env-file .env.production -f docker-compose.production.yml logs --tail=20 postgres || true
            sleep 2
          done
          docker compose --env-file .env.production -f docker-compose.production.yml exec -T postgres pg_isready -U repository_agent -d repository_agent
          docker compose --env-file .env.production -f docker-compose.production.yml up -d api
          sleep 5
          docker compose --env-file .env.production -f docker-compose.production.yml ps
          docker compose --env-file .env.production -f docker-compose.production.yml logs --tail=100 api || true
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz/; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/healthz/
          curl -fsS http://127.0.0.1:8000/readyz/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: container-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/smart-campus-ai-system
          docker build -t $IMAGE:${{ github.ref_name }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.ref_name }}
          docker push $IMAGE:latest
