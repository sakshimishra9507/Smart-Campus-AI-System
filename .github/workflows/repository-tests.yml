name: Repository Tests

on:
  push:
    branches:
      - main
      - feature/repository-intelligence
      - feature/ai-llm-infrastructure
      - feature/agent-orchestration
      - feature/autonomous-debugging-workflow
      - feature/repository-execution-sandbox
      - feature/closed-loop-debugging
      - feature/git-automation
      - feature/realtime-agent-progress
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev build-essential pkg-config

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run test suite
        env:
          SECRET_KEY: ci-test-only-not-for-production
        run: |
          python -m pytest -q
